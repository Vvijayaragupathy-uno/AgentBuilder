# Railway: https://docs.railway.com/reference/config-as-code
# One PostgreSQL plugin → DATABASE_URL. Langflow: public schema; AICCORE: aiccore schema.
# Optional: LANGFLOW_DATABASE_URL / AICCORE_DATABASE_URL = same reference (see aiccore/README.md).

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
